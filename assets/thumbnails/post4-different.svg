<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f06"/>
      <stop offset="100%" style="stop-color:#173404"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="628" fill="url(#bg4)"/>

  <!-- Terminal window -->
  <rect x="60" y="60" width="700" height="380" rx="12" fill="#111a0a"/>
  <rect x="60" y="60" width="700" height="40" rx="12" fill="#1e2a10"/>
  <rect x="60" y="88" width="700" height="14" fill="#1e2a10"/>
  <circle cx="90" cy="80" r="7" fill="#E24B4A"/>
  <circle cx="114" cy="80" r="7" fill="#EF9F27"/>
  <circle cx="138" cy="80" r="7" fill="#639922"/>
  <text x="410" y="86" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="Courier New, monospace">set-vars.ps1</text>

  <!-- Code content -->
  <text x="90" y="140" font-size="17" fill="#888780" font-family="Courier New, monospace"># Load these at the start of every session</text>
  <text x="90" y="174" font-size="17" fill="#5DCAA5" font-family="Courier New, monospace">$rg       = "rg-lab01-giovanni"</text>
  <text x="90" y="208" font-size="17" fill="#5DCAA5" font-family="Courier New, monospace">$location = "eastus"</text>
  <text x="90" y="242" font-size="17" fill="#5DCAA5" font-family="Courier New, monospace">$storage  = "stlab01giovanni47"</text>

  <line x1="90" y1="268" x2="720" y2="268" stroke="#2a3a1a" stroke-width="1"/>

  <text x="90" y="304" font-size="17" fill="#EF9F27" font-family="Courier New, monospace">. .\set-vars.ps1</text>
  <text x="90" y="338" font-size="17" fill="#97C459" font-family="Courier New, monospace">Variables loaded:</text>
  <text x="90" y="368" font-size="17" fill="#97C459" font-family="Courier New, monospace">  Resource Group : rg-lab01-giovanni ✓</text>
  <text x="90" y="398" font-size="17" fill="#97C459" font-family="Courier New, monospace">  Storage Account: stlab01giovanni47 ✓</text>

  <!-- Right side text -->
  <text x="820" y="160" font-size="52" fill="white" font-weight="900">What I'd</text>
  <text x="820" y="226" font-size="52" fill="white" font-weight="900">do</text>
  <text x="820" y="292" font-size="52" fill="#97C459" font-weight="900">differently.</text>

  <text x="820" y="360" font-size="22" fill="#639922">Save your variables</text>
  <text x="820" y="392" font-size="22" fill="#639922">before running</text>
  <text x="820" y="424" font-size="22" fill="#639922">anything.</text>

  <!-- Bottom bar -->
  <line x1="60" y1="480" x2="1140" y2="480" stroke="#3B6D11" stroke-width="1" opacity="0.5"/>
  <text x="60" y="518" font-size="18" fill="#97C459">What I'd do differently · Cloud Engineering Accelerator · Lab 01</text>
  <text x="60" y="552" font-size="16" fill="#639922">#Azure #AzureCLI #PowerShell #LabLife #LessonsLearned</text>
