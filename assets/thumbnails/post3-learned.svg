<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1050"/>
      <stop offset="100%" style="stop-color:#26215C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="628" fill="url(#bg3)"/>

  <!-- Code block background -->
  <rect x="60" y="60" width="1080" height="130" rx="10" fill="#1e1a5e" opacity="0.8"/>
  <rect x="60" y="60" width="1080" height="130" rx="10" fill="none" stroke="#7F77DD" stroke-width="1" opacity="0.5"/>

  <!-- Left highlight bar on code block -->
  <rect x="60" y="60" width="6" height="130" rx="3" fill="#EF9F27"/>

  <text x="90" y="110" font-size="22" fill="#AFA9EC" font-family="Courier New, monospace">az storage account create \</text>
  <text x="90" y="146" font-size="22" fill="#AFA9EC" font-family="Courier New, monospace">  --https-only true  \  --min-tls-version TLS1_2</text>
  <text x="90" y="178" font-size="18" fill="#EF9F27" font-family="Courier New, monospace">↑ These two flags are not on by default.</text>

  <!-- Main headline -->
  <text x="60" y="280" font-size="90" fill="white" font-weight="900">Two flags.</text>
  <text x="60" y="380" font-size="90" fill="#CECBF6" font-weight="900">Thirty seconds.</text>
  <text x="60" y="480" font-size="90" fill="#EF9F27" font-weight="900">Secure from day one.</text>

  <!-- Bottom label -->
  <line x1="60" y1="520" x2="1140" y2="520" stroke="#534AB7" stroke-width="1" opacity="0.5"/>
  <text x="60" y="558" font-size="18" fill="#AFA9EC">One thing I learned · Cloud Engineering Accelerator · Lab 01</text>
  <text x="60" y="590" font-size="16" fill="#7F77DD">#Azure #CloudSecurity #BlobStorage #HTTPS #AzureCLI</text>
</svg>
